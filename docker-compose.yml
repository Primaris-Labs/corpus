services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs

  ui:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    command: python src/ui/app.py
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
