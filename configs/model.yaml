model:
  name: mobilenet_v2          # or resnet50
  num_classes: 22             # update once dataset classes are confirmed
  pretrained: true

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 5

data:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
